# Builds the site and publishes it to GitHub Pages. It does nothing until Pages is
# enabled for this repository (Settings > Pages > Source: GitHub Actions), which
# is a deliberate, manual step.
name: Deploy to GitHub Pages

# Manual trigger only, so nothing is published without approval. Once Pages is
# enabled and approved, add `push: { branches: [main] }` here to deploy on merge.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
