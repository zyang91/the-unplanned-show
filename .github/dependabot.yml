# Automated dependency updates. Dependabot opens pull requests only; nothing is
# merged or deployed automatically. CI (.github/workflows/ci.yml) runs on each PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      lint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "typescript-eslint", "globals"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # @astrojs/check only supports typescript ^5 || ^6; revisit when it adds 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
